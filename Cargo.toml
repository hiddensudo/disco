[package]
name = "disco"
version = "0.9.2"
edition = "2024"
rust-version = "1.95"
description = "Native Linux disk space analyzer with snapshots, cleanup, and trash management"
repository = "https://github.com/hiddensudo/disco"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
resvg = { version = "0.45", default-features = false }
walkdir = "2.5"
libc = "0.2"
blake3 = "1.8"
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "async-std"] }
trash = "5.2"
image = { version = "0.25", default-features = false, features = ["png"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
bincode = { version = "2", default-features = false, features = ["serde", "std"] }
toml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
# Keep malformed .trashinfo lines from panicking; preserve = in path names.
trash = { path = "vendor/trash" }
